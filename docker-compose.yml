services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superpont}
      POSTGRES_USER: ${POSTGRES_USER:-superpont}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:25-jdk-jammy
    working_dir: /app
    command: sh ./gradlew bootRun --no-daemon
    volumes:
      - ./backend:/app
      - gradle_cache:/root/.gradle
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LEADERBOARD_DEMO: ${LEADERBOARD_DEMO:-false}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-superpont}
      DATABASE_USERNAME: ${POSTGRES_USER:-superpont}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-${FRONTEND_URL:-http://localhost:5173}}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS_ENABLED: "false"
      SMTP_STARTTLS_REQUIRED: "false"
      SMTP_SSL_ENABLED: "false"
      SMTP_FROM: ${SMTP_FROM:-Super Pont <no-reply@superpont.local>}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  gradle_cache:
  frontend_node_modules:
