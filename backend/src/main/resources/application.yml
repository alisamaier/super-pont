spring:
  application:
    name: super-pont-backend
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS_REQUIRED:true}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL_ENABLED:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.debug]": false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      accept-float-as-int: false

app:
  frontend-url: ${FRONTEND_URL}
  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:${app.frontend-url}}
  mail:
    from: ${SMTP_FROM:no-reply@superpont.example}
  auth:
    rate-limit:
      login-ip:
        attempts: 5
        window: 1m
      registration-ip:
        attempts: 3
        window: 10m
      login-email:
        attempts: 5
        window: 1m
      verification-ip:
        attempts: 30
        window: 1m
      verification-registration:
        attempts: 10
        window: 1m
      email-ip:
        attempts: 20
        window: 1h
      email-registration:
        attempts: 6
        window: 1h
      password-reset-ip:
        attempts: 10
        window: 1h
      password-reset-email:
        attempts: 3
        window: 1h
      password-reset-submission-ip:
        attempts: 30
        window: 15m
      password-reset-token:
        attempts: 10
        window: 15m

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      cors:
        allowed-origins: ${app.frontend-url}
        allowed-methods: GET,HEAD,OPTIONS
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${AUTH_TRUSTED_PROXY_CIDRS:(?!)}"
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

