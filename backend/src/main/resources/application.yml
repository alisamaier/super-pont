spring:
  application:
    name: super-pont-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      accept-float-as-int: false

app:
  frontend-url: ${FRONTEND_URL}
  auth:
    rate-limit:
      login-ip:
        attempts: 5
        window: 1m
      registration-ip:
        attempts: 3
        window: 10m
      login-username:
        attempts: 5
        window: 1m

management:
  endpoints:
    web:
      cors:
        allowed-origins: ${app.frontend-url}
        allowed-methods: GET,HEAD,OPTIONS
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${AUTH_TRUSTED_PROXY_CIDRS:(?!)}"
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

